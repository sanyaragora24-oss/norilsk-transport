# GitHub Actions: сборка iOS-приложения на macOS runner.
#
# Что проверяется:
#  1. Xcode указанной версии реально выбран (xcode-select + проверка версии)
#  2. Xcode-проект генерируется из project.yml через xcodegen
#  3. CocoaPods устанавливаются (YandexMapsMobile 4.45.0-full)
#  4. JSON-ассеты валидны
#  5. Swift компилируется: xcodebuild под iOS Simulator
#  6. Собранный .app реально существует и загружается как artifact
#
# Любая ошибка xcodebuild роняет workflow (проверяется код возврата,
# а не код tail/tee).

name: iOS Build

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'iosApp/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [main, 'arena/**']
    paths:
      - 'iosApp/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:  # ручной запуск из вкладки Actions

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS app (Xcode ${{ matrix.xcode }}, iOS ${{ matrix.ios }})
    runs-on: macos-14
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # Версия должна существовать в образе раннера:
        # см. actions/runner-images → images/macos/macos-14-Readme.md
        # (Xcode 15.4 по умолчанию, доступны 15.x, 16.1, 16.2).
        xcode: ['16.2']
        ios: ['17.0']

    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      # Используется при подстановке $(YANDEX_MAPKIT_API_KEY) в Info.plist.
      # Без секрета подставляется placeholder: сборка валидна, тайлы карты не загрузятся.
      YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY || 'placeholder-update-before-release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          set -euo pipefail
          XCODE_APP="/Applications/Xcode_${{ matrix.xcode }}.app"
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::Xcode ${{ matrix.xcode }} не найден по пути $XCODE_APP"
            echo "Доступные Xcode в образе:"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "=== xcodebuild -version ==="
          xcodebuild -version
          # Проверяем, что выбралась именно запрошенная версия
          ACTUAL="$(xcodebuild -version | head -1 | awk '{print $2}')"
          echo "Requested: ${{ matrix.xcode }} / Actual: ${ACTUAL}"
          if [ "${ACTUAL}" != "${{ matrix.xcode }}" ]; then
            echo "::error::Выбран Xcode ${ACTUAL}, ожидался ${{ matrix.xcode }}"
            exit 1
          fi

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true
          ruby -v
          pod --version

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            iosApp/Pods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('iosApp/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: iosApp
        run: |
          set -euo pipefail
          xcodegen generate
          if [ ! -d "NorilskTransit.xcodeproj" ]; then
            echo "::error::NorilskTransit.xcodeproj не создан"
            exit 1
          fi
          echo "=== Project files ==="
          ls -la

      - name: Install pods
        working-directory: iosApp
        run: |
          set -euo pipefail
          pod install --repo-update
          if [ ! -d "Pods" ] || [ ! -f "NorilskTransit.xcworkspace/contents.xcworkspacedata" ]; then
            echo "::error::pod install не создал Pods/ или .xcworkspace"
            exit 1
          fi
          echo "=== Установленные поды ==="
          pod list 2>/dev/null | grep -i -E "Yandex|Firebase|Alamofire" || true

      - name: Verify JSON assets
        working-directory: iosApp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json

          routes = json.load(open('Resources/norilsk_routes.json'))['routes']
          schedule = json.load(open('Resources/norilsk_schedule.json'))['routes']

          print(f'routes: {len(routes)}')
          print(f'schedule: {len(schedule)}')

          assert len(routes) >= 50, f'routes count too low: {len(routes)}'
          assert len(schedule) >= 50, f'schedule count too low: {len(schedule)}'

          # Структура маршрута
          r0 = routes[0]
          for key in ('id', 'number', 'origin', 'destination', 'colorArgb', 'stops', 'polyline'):
              assert key in r0, f'route[0] missing key: {key}'
          assert len(r0['polyline']) >= 2, 'route polyline too short'

          # Маршрут 31 и расписание 31Э должны присутствовать в данных
          numbers = {r['number'] for r in routes}
          assert '31' in numbers, 'маршрут 31 отсутствует в norilsk_routes.json'
          sched_numbers = {v.get('number') for v in schedule.values()}
          assert '31Э' in sched_numbers, 'расписание 31Э отсутствует в norilsk_schedule.json'

          print('JSON assets OK')
          PY

      - name: Build for simulator
        working-directory: iosApp
        run: |
          set -euo pipefail
          # -derivedDataPath фиксирует путь до .app (дальше он проверяется и уходит в artifact).
          # generic/platform=iOS Simulator — без требования конкретной версии рантайма симулятора.
          if ! xcodebuild \
            -workspace NorilskTransit.xcworkspace \
            -scheme NorilskTransit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log | tail -200 ; then
            echo "::error::xcodebuild завершился с ошибкой (см. build.log в артефактах)"
            exit 1
          fi
          echo "=== xcodebuild: OK ==="

      - name: Show build log on failure
        if: failure()
        working-directory: iosApp
        run: |
          if [ -f build.log ]; then
            echo "=== Последние 400 строк build.log ==="
            tail -400 build.log
            echo "=== Ошибки ==="
            grep -n "error:" build.log | head -50 || true
          fi

      - name: Verify .app bundle
        working-directory: iosApp
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/NorilskTransit.app"
          if [ ! -d "$APP" ]; then
            echo "::error::.app bundle не найден: $APP"
            find build/DerivedData -maxdepth 6 -name "*.app" 2>/dev/null || true
            exit 1
          fi
          echo "App bundle: $APP"
          echo "=== Размер ==="
          du -sh "$APP"
          echo "=== Info.plist (ключевые поля) ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :UIRequiredDeviceCapabilities" "$APP/Info.plist"
          echo "=== Ресурсы в bundle ==="
          ls "$APP" | grep -E "(json|xcprivacy)$" || true
          echo "=== Зависимости MapKit ==="
          ls "$APP/Frameworks" 2>/dev/null || true

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: NorilskTransit-app-${{ github.sha }}
          path: |
            iosApp/build.log
            iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator/NorilskTransit.app
          if-no-files-found: error   # отсутствие .app = ошибка, а не warning
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          {
            echo "## iOS build status: ${{ job.status }}"
            echo ""
            echo "### Что проверено:"
            echo "- Xcode ${{ matrix.xcode }} выбран и подтверждён"
            echo "- xcodegen: проект сгенерирован из project.yml"
            echo "- CocoaPods: YandexMapsMobile 4.45.0-full установлен"
            echo "- JSON-ассеты: маршруты, расписания, маршрут 31 и 31Э"
            echo "- xcodebuild: компиляция под iOS ${{ matrix.ios }} Simulator"
            echo "- .app bundle: проверен и загружен как artifact"
          } >> "$GITHUB_STEP_SUMMARY"
