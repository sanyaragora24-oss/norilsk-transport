# GitHub Actions: сборка iOS-приложения на macOS runner.
#
# Что проверяется:
#  1. Xcode указанной версии реально выбран (xcode-select + проверка версии)
#  2. Xcode-проект генерируется из project.yml через xcodegen
#  3. CocoaPods устанавливаются (YandexMapsMobile 4.45.0-full)
#  4. JSON-ассеты валидны
#  5. Swift компилируется: xcodebuild под iOS Simulator
#  6. Собранный .app реально существует и загружается как artifact
#
# Любая ошибка xcodebuild роняет workflow (проверяется код возврата,
# а не код tail/tee).

name: iOS Build

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'iosApp/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [main, 'arena/**']
    paths:
      - 'iosApp/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:  # ручной запуск из вкладки Actions

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS app (Xcode ${{ matrix.xcode }}, iOS ${{ matrix.ios }})
    runs-on: macos-14
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # Версия должна существовать в образе раннера:
        # см. actions/runner-images → images/macos/macos-14-Readme.md
        # (Xcode 15.4 по умолчанию, доступны 15.x, 16.1, 16.2).
        xcode: ['16.2']
        ios: ['17.0']

    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      # Используется при подстановке $(YANDEX_MAPKIT_API_KEY) в Info.plist.
      # Без секрета подставляется placeholder: сборка валидна, тайлы карты не загрузятся.
      YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY || 'placeholder-update-before-release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          set -uo pipefail
          LOG="$GITHUB_WORKSPACE/iosApp/xcode-select.log"
          : > "$LOG"
          WANT="${{ matrix.xcode }}"
          echo "Wanted Xcode: $WANT" | tee -a "$LOG"
          echo "=== /Applications/Xcode*.app ===" | tee -a "$LOG"
          ls -d /Applications/Xcode*.app 2>/dev/null | tee -a "$LOG" || echo "(none)" | tee -a "$LOG"

          # Кандидаты: сначала запрошенная версия, затем остальные по убыванию
          CANDIDATES="/Applications/Xcode_${WANT}.app"
          CANDIDATES="$CANDIDATES $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -rV)"

          SELECTED=""
          for APP in $CANDIDATES; do
            [ -d "$APP" ] || continue
            DEV="$APP/Contents/Developer"
            [ -d "$DEV" ] || continue
            sudo xcode-select -s "$DEV" >/dev/null 2>&1
            # На свежих образах раннеров xcodebuild падает, если лицензия не принята
            sudo xcodebuild -license accept >/dev/null 2>&1
            OUT="$(xcodebuild -version 2>&1)"
            CODE=$?
            echo "--- $APP -> exit $CODE: $(echo "$OUT" | head -2 | tr '\n' ' ')" | tee -a "$LOG"
            if [ "$CODE" -eq 0 ]; then SELECTED="$APP"; break; fi
          done

          if [ -z "$SELECTED" ]; then
            echo "::error::Ни один Xcode из образов не отвечает на xcodebuild -version" | tee -a "$LOG"
            exit 1
          fi

          ACTUAL="$(xcodebuild -version | head -1 | awk '{print $2}')"
          echo "SELECTED_APP=$SELECTED" | tee -a "$LOG"
          echo "ACTUAL=$ACTUAL" | tee -a "$LOG"
          if [ "$ACTUAL" != "$WANT" ]; then
            echo "::warning title=xcode-fallback::Запрошен Xcode $WANT, но он недоступен/нерабочий в образе раннера. Используется $ACTUAL ($SELECTED)"
          else
            echo "::notice title=xcode-selected::Xcode $ACTUAL ($SELECTED)"
          fi
          echo "XCODE_ACTUAL=$ACTUAL" >> "$GITHUB_ENV"
          xcodebuild -version | tee -a "$LOG"

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true
          ruby -v
          pod --version

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            iosApp/Pods
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('iosApp/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: iosApp
        run: |
          set -euo pipefail
          xcodegen generate 2>&1 | tee xcodegen.log
          if [ ! -d "NorilskTransit.xcodeproj" ]; then
            echo "::error::NorilskTransit.xcodeproj не создан"
            exit 1
          fi
          echo "=== Project files ==="
          ls -la
          # Диагностика: какие таргеты и схемы реально сгенерированы
          xcodebuild -project NorilskTransit.xcodeproj -list

      - name: Install pods
        working-directory: iosApp
        run: |
          set -euo pipefail
          # Без --repo-update: CDN trunk резолвит спецификации по требованию,
          # а полное обновление спецификаций съедает минуты на каждом прогоне.
          echo "=== pod install started: $(date -u +%H:%M:%S) ==="
          time pod install 2>&1 | tee pod.log
          echo "=== pod install finished: $(date -u +%H:%M:%S) ==="
          if [ ! -d "Pods" ] || [ ! -f "NorilskTransit.xcworkspace/contents.xcworkspacedata" ]; then
            echo "::error::pod install не создал Pods/ или .xcworkspace"
            exit 1
          fi
          echo "=== Установленные поды ==="
          grep -E "YandexMapsMobile|Firebase|Alamofire" Podfile.lock || true
          echo "=== Размер Pods ==="
          du -sh Pods 2>/dev/null || true
          # Факт установки публикуем как notice: видно через API check-runs/annotations
          echo "::notice title=resolved-pods::$(grep -E '^\s+- YandexMapsMobile' Podfile.lock | head -3 | tr '\n' ' ')"
          for slice in Pods/YandexMapsMobile/YandexMapsMobile.xcframework/*/; do
            [ -d "$slice" ] || continue
            echo "::notice title=xcframework-slice::$(basename "$slice") $(du -sh "$slice" | cut -f1)"
          done

      - name: Verify JSON assets
        working-directory: iosApp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json

          routes = json.load(open('Resources/norilsk_routes.json'))['routes']
          schedule = json.load(open('Resources/norilsk_schedule.json'))['routes']

          print(f'routes: {len(routes)}')
          print(f'schedule: {len(schedule)}')

          assert len(routes) >= 50, f'routes count too low: {len(routes)}'
          assert len(schedule) >= 50, f'schedule count too low: {len(schedule)}'

          # Структура маршрута
          r0 = routes[0]
          for key in ('id', 'number', 'origin', 'destination', 'colorArgb', 'stops', 'polyline'):
              assert key in r0, f'route[0] missing key: {key}'
          assert len(r0['polyline']) >= 2, 'route polyline too short'

          # Маршрут 31 и расписание 31Э должны присутствовать в данных
          numbers = {r['number'] for r in routes}
          assert '31' in numbers, 'маршрут 31 отсутствует в norilsk_routes.json'
          sched_numbers = {v.get('number') for v in schedule.values()}
          assert '31Э' in sched_numbers, 'расписание 31Э отсутствует в norilsk_schedule.json'

          print('JSON assets OK')
          PY

      - name: Build for simulator
        working-directory: iosApp
        run: |
          set -euo pipefail
          # -derivedDataPath фиксирует путь до .app (дальше он проверяется и уходит в artifact).
          # generic/platform=iOS Simulator — без требования конкретной версии рантайма симулятора.
          if ! xcodebuild \
            -workspace NorilskTransit.xcworkspace \
            -scheme NorilskTransit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build 2>&1 | tee build.log | tail -200 ; then
            echo "::error::xcodebuild завершился с ошибкой (см. build.log в артефактах)"
            exit 1
          fi
          echo "=== xcodebuild: OK ==="

      - name: Run unit tests
        working-directory: iosApp
        run: |
          set -euo pipefail
          # Unit-тесты NorilskTransitCoreTests — «логические» (без host-приложения),
          # поэтому приложение и MapKit не запускаются: проверяются парсеры и
          # логика расписаний на реальных JSON из Resources.
          #
          # Симулятор создаём сами: состав устройств в образе раннера меняется,
          # поэтому берём последний доступный iPhone и самый свежий iOS-рантайм.
          DEVICE_NAME="NorilskCI-iPhone"
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          rs = [r for r in d["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]
          rs.sort(key=lambda r: [int(x) for x in r["version"].split(".")])
          print(rs[-1]["identifier"] if rs else "")
          ')
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys, re
          d = json.load(sys.stdin)
          ds = []
          for t in d["devicetypes"]:
              m = re.match(r".*SimDeviceType\.iPhone-(\d+)$", t["identifier"])
              if m:
                  ds.append((int(m.group(1)), t["identifier"]))
          ds.sort()
          print(ds[-1][1] if ds else "")
          ')
          echo "runtime: $RUNTIME"
          echo "device type: $DEVICE_TYPE"
          if [ -z "$RUNTIME" ] || [ -z "$DEVICE_TYPE" ]; then
            echo "::error::Не удалось определить симулятор (runtime=$RUNTIME device=$DEVICE_TYPE)"
            exit 1
          fi
          xcrun simctl delete "$DEVICE_NAME" >/dev/null 2>&1 || true
          xcrun simctl create "$DEVICE_NAME" "$DEVICE_TYPE" "$RUNTIME"
          echo "::notice title=simulator::$DEVICE_NAME ($DEVICE_TYPE / $RUNTIME)"

          if ! xcodebuild \
            -workspace NorilskTransit.xcworkspace \
            -scheme NorilskTransit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=$DEVICE_NAME" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            test 2>&1 | tee test.log | tail -120 ; then
            echo "::error title=unit-tests::unit-тесты провалились (см. test.log в артефактах)"
            # У шага максимум 10 аннотаций — публикуем только реальные ошибки:
            # без фильтра слоты занимают ld-предупреждения MapKit.
            esc() { sed -e 's/%/%25/g' -e 's/\r/%0D/g'; }
            grep -E "error:|FAILED|Undefined symbols|No such module|Library not loaded|Testing failed|failed -|crashed|Unable to|caught error" test.log \
              | grep -v "ld: warning" | cut -c1-300 | head -5 | esc \
              | while IFS= read -r line; do
                  [ -n "$line" ] && echo "::error title=test-log::$line"
                done
            grep -E "^(Test Suite|Executed|\*\* )" test.log | cut -c1-300 | tail -3 | esc \
              | while IFS= read -r line; do
                  [ -n "$line" ] && echo "::error title=test-summary::$line"
                done
            exit 1
          fi
          echo "=== unit tests: OK ==="

          # Проверяем, что тесты действительно выполнились: пустой прогон или
          # «0 tests» — это тоже провал, даже если xcodebuild вернул 0.
          SUMMARY=$(grep -E "Executed [0-9]+ tests" test.log | tail -1 || true)
          echo "test summary: $SUMMARY"
          if [ -z "$SUMMARY" ]; then
            echo "::error title=unit-tests::В test.log нет строки 'Executed N tests' — тесты могли не запуститься"
            exit 1
          fi
          case "$SUMMARY" in
            *"with 0 failures"*)
              echo "::notice title=unit-tests::$SUMMARY"
              ;;
            *)
              echo "::error title=unit-tests::$SUMMARY"
              exit 1
              ;;
          esac
          echo "TEST_SUMMARY=$SUMMARY" >> "$GITHUB_ENV"

      # Публикует текст ошибок как annotations: они доступны через GitHub API
      # (check-runs/annotations) даже тогда, когда логи скачать нельзя.
      - name: Publish failure diagnostics
        if: failure()
        working-directory: iosApp
        run: |
          set +e
          esc() { sed -e 's/%/%25/g' -e 's/\r/%0D/g'; }
          # GitHub публикует максимум 10 аннотаций на шаг, поэтому:
          #   - логи тестов идут раньше логов сборки;
          #   - ld-предупреждения MapKit отфильтрованы (иначе занимают все слоты).
          for log in test.log build.log xcodegen.log pod.log; do
            [ -f "$log" ] || continue
            grep -E "(^|[^a-zA-Z-])error:|fatal error:|Undefined symbols|No such module|could not build module|BUILD FAILED|TEST FAILED|clang: error|error:.*generated" "$log" \
              | grep -v "ld: warning" | cut -c1-300 | head -4 | esc \
              | while IFS= read -r line; do
                  [ -n "$line" ] && echo "::error title=$log::$line"
                done
          done

      - name: Verify .app bundle
        working-directory: iosApp
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/NorilskTransit.app"
          if [ ! -d "$APP" ]; then
            echo "::error::.app bundle не найден: $APP"
            find build/DerivedData -maxdepth 6 -name "*.app" 2>/dev/null || true
            exit 1
          fi
          echo "App bundle: $APP"
          echo "=== Размер ==="
          du -sh "$APP"
          echo "=== Info.plist (ключевые поля) ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :UIRequiredDeviceCapabilities" "$APP/Info.plist"
          echo "=== Ресурсы в bundle ==="
          ls "$APP" | grep -E "(json|xcprivacy)$" || true
          # Данные приложения обязаны лежать внутри .app: без них экраны пустые.
          # Ищем рекурсивно: XcodeGen может скопировать Resources как folder reference.
          echo "=== Поиск JSON внутри .app ==="
          find "$APP" -name "*.json" | head -10
          echo "::notice title=app-json::$(find "$APP" -name '*.json' | head -6 | tr '\n' ' ')"
          FOUND=0
          for dataFile in norilsk_routes.json norilsk_schedule.json; do
            if [ -f "$APP/$dataFile" ] || [ -n "$(find "$APP" -name "$dataFile" -print -quit)" ]; then
              FOUND=$((FOUND + 1))
            else
              echo "::warning title=app-data::в .app не найден $dataFile"
            fi
          done
          if [ "$FOUND" -ne 2 ]; then
            echo "::error::В .app не найдены файлы данных (найдено $FOUND из 2)"
            exit 1
          fi
          echo "=== Зависимости MapKit ==="
          ls "$APP/Frameworks" 2>/dev/null || true
          echo "::notice title=app-size::$(du -sh "$APP" | cut -f1)"
          echo "::notice title=app-frameworks::$(ls "$APP/Frameworks" 2>/dev/null | tr '\n' ' ')"
          echo "::notice title=app-resources::$(ls "$APP" | grep -E '(json|xcprivacy)' | tr '\n' ' ')"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v6
        with:
          name: NorilskTransit-app-${{ github.sha }}
          path: |
            iosApp/build.log
            iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator/NorilskTransit.app
          if-no-files-found: error   # отсутствие .app = ошибка, а не warning
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          {
            echo "## iOS build status: ${{ job.status }}"
            echo ""
            echo "### Что проверено:"
            echo "- Xcode: запрошен ${{ matrix.xcode }}, фактически использован ${XCODE_ACTUAL:-неизвестно}"
            echo "- xcodegen: проект сгенерирован из project.yml"
            echo "- CocoaPods: YandexMapsMobile 4.45.0-full установлен"
            echo "- JSON-ассеты: маршруты, расписания, маршрут 31 и 31Э"
            echo "- xcodebuild: компиляция под iOS ${{ matrix.ios }} Simulator"
            echo "- unit-тесты: ${TEST_SUMMARY:-не запускались}"
            echo "- .app bundle: проверен и загружен как artifact"
          } >> "$GITHUB_STEP_SUMMARY"
