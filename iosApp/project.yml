# project.yml — XcodeGen описание проекта.
# Установить xcodegen: brew install xcodegen
# Сгенерировать проект: cd iosApp && xcodegen generate
# Затем: pod install && open NorilskTransit.xcworkspace

name: NorilskTransit
options:
  bundleIdPrefix: ru.norilsk.transit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: ru

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.2.6"
    CURRENT_PROJECT_VERSION: "8"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""  # Заполнить Apple Developer ID (10 символов) перед архивом
    ENABLE_BITCODE: NO    # bitcode удалён в Xcode 14+, YES ломает линковку SDK Яндекса

targets:
  # Модели, парсеры и логика расписаний. Сознательно без UIKit/MapKit/SwiftUI:
  # только Foundation, поэтому покрывается unit-тестами без запуска приложения
  # и без инициализации MapKit (у которого в CI нет валидного API-ключа).
  NorilskTransitCore:
    type: library.static
    platform: iOS
    sources:
      # Каталог Core лежит РЯДОМ с Sources, а не внутри него: у приложения в
      # sources указан весь Sources, и исключать подкаталог пришлось бы glob-ом
      # относительно пути группы (Sources/Core/**), что легко сломать.
      - path: Core
    settings:
      base:
        # Статическая библиотека: Info.plist не нужен, бандл-идентификатор тоже.
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES

  NorilskTransit:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Точка входа @main лежит в корне iosApp и ОБЯЗАНА быть в sources,
      # иначе таргет не содержит entry point и сборка падает.
      - path: NorilskTransitApp.swift
    dependencies:
      - target: NorilskTransitCore
        link: true
    resources:
      # JSON-ассеты и PrivacyInfo.xcprivacy лежат в iosApp/Resources.
      # Раньше здесь были ссылки на ../app/src/main/assets/*.json —
      # каталога app/ в репозитории нет, плюс это дублировало ресурсы.
      # buildPhase задан явно: без него JSON не попадали в .app.
      - path: Resources
        buildPhase: resources
    info:
      # ВАЖНО: для Plist в XcodeGen ключ `path` ОБЯЗАТЕЛЕН
      # (Sources/ProjectSpec/Plist.swift: path = try jsonDictionary.json(atKeyPath: "path")).
      # XcodeGen сам создаёт этот файл при генерации и прописывает INFOPLIST_FILE.
      # Файл генерируемый — он в .gitignore.
      path: Info.plist
      properties:
        CFBundleDisplayName: Норильский транспорт
        CFBundleShortVersionString: "1.2.6"
        CFBundleVersion: "8"
        UIRequiredDeviceCapabilities: [arm64]   # было armv7 — на iOS 17 устройства не ставится
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSLocationWhenInUseUsageDescription: "Нужен для отображения ближайших остановок и работы будильника у выбранной остановки"
        NSLocationAlwaysAndWhenInUseUsageDescription: "Нужен для отслеживания вашего местоположения, чтобы будить вас за 350 м до нужной остановки"
        UIBackgroundModes: [location]
        YANDEX_MAPKIT_API_KEY: "$(YANDEX_MAPKIT_API_KEY)"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.norilsk.transit
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only
        # LaunchScreen.storyboard в репозитории нет — используем генерируемый Xcode
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  # Unit-тесты парсинга и расписаний. Тесты «логические» (без host-приложения):
  # зависят только от NorilskTransitCore, поэтому не запускают MapKit.
  NorilskTransitCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    resources:
      # Те же JSON, что и в приложении: тесты проверяют реальные данные
      - path: Resources
        # Путь в excludes — относительно пути группы (Resources), см. проектный
        # SourceGenerator: excludes разрешаются как <basePath>/<group path>/<pattern>
        excludes:
          - PrivacyInfo.xcprivacy
    dependencies:
      - target: NorilskTransitCore
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.norilsk.transit.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

schemes:
  NorilskTransit:
    build:
      targets:
        NorilskTransit: all
        NorilskTransitCore: all
        NorilskTransitCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NorilskTransitCoreTests
    analyze:
      config: Debug
    archive:
      config: Release
